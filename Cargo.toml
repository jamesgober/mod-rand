[package]
name = "mod-rand"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
readme = "README.md"
license = "Apache-2.0"

authors = [
    "James Gober <me@jamesgober.com>"
]

description = "Tiered randomness for Rust: fast PRNG, process-unique seeds, and OS-backed cryptographic random — plus bounded ranges, strings, tokens, shuffle, sample, and weighted choice. Zero dependencies, MSRV 1.75."

keywords = [
    "random",
    "rng",
    "prng",
    "crypto",
    "uuid"
]

categories = [
    "algorithms",
    "cryptography",
    "no-std"
]

documentation = "https://docs.rs/mod-rand"
repository    = "https://github.com/jamesgober/mod-rand"
homepage      = "https://github.com/jamesgober/mod-rand"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]

[dev-dependencies]

[features]
default = ["std", "tier2", "tier3"]
# Tier 1 (fast PRNG) is always available; the rest are opt-in.
std = []
tier2 = ["std"]
tier3 = ["std"]

[profile.release]
opt-level = 3
lto = "thin"

[[bench]]
name = "tier1"
harness = false

[[bench]]
name = "tier2"
harness = false
required-features = ["tier2"]

[[bench]]
name = "tier3"
harness = false
required-features = ["tier3"]
